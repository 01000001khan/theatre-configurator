<!DOCTYPE html>
<html>
    <head>
        <style>
            .render {
                position: absolute;
                width: 100px;
                height: 100px;
                left: 200px;
                top: 200px;
                display: block;
                transform-origin: top left;
                user-select: none;
            }
            
            body {
                background-color: #474240;
                color: #eee;
            }

            #x_wall {
                width: 100px;
                height: 100px;
            }
            #y_wall {
                width: 100px;
                height: 100px;
            }
            #z_wall {
                width: 100px;
                height: 100px;
            }
        </style>
    </head>
    <body>
        <input type="range" id="x_dim" min="50" max="200" oninput="x_dim(value)"/>
        <input type="range" id="y_dim" min="50" max="200" oninput="y_dim(value)"/>
        <input type="range" id="y_dim" min="50" max="200" oninput="z_dim(value)"/>
        <div>
            <div style="position: absolute">
                <img src="./0002.png" class="render" id="x_wall" style="transform: matrix(-0.8660254038, .5, 0, -1, 0, 0)" />
            </div>
            <div style="position: absolute">
                <img src="./0003.png" class="render" id="y_wall" style="transform: matrix(0, -1, 0.8660254038, .5, 0, 0)" />
            </div>
            <div style="position: absolute">
                <img src="./0004.png" class="render" id="z_wall" style="transform: matrix(0.8660254038, .5, -0.8660254038, .5, 0, 0)" />
            </div>
            <div style="position: absolute">
                <img src="./0005.png" class="render" id="speaker" style="left: 200px; top: 179px;" />
            </div>
        </div>
        <br>

        <img src="./0001.png" style="position: relative; width: 300px; top: 400px" />
    </body>
    
    <script>
        
        function x_dim(x){
            document.querySelector("#y_wall").style.height = x + "px";
            document.querySelector("#z_wall").style.width = x + "px";
        }

        function y_dim(x){
            document.querySelector("#x_wall").style.width = x + "px";
            document.querySelector("#z_wall").style.height = x + "px";
        }

        function z_dim(x){
            document.querySelector("#y_wall").style.width = x + "px";
            document.querySelector("#x_wall").style.height = x + "px";
        }

    </script>
</html>
